<script>
(function(){
  const supported = ["en","es","pt","fr","it"];
  const path = window.location.pathname;

  function detectBrowserLanguage(){
    const browserLang = (navigator.language || navigator.userLanguage || "en").toLowerCase();
    if(browserLang.startsWith("es")) return "es";
    if(browserLang.startsWith("pt")) return "pt";
    if(browserLang.startsWith("fr")) return "fr";
    if(browserLang.startsWith("it")) return "it";
    return "en";
  }

  let lang = null;

  if(path.startsWith("/es/")) lang = "es";
  else if(path.startsWith("/pt/")) lang = "pt";
  else if(path.startsWith("/fr/")) lang = "fr";
  else if(path.startsWith("/it/")) lang = "it";
  else if(path.startsWith("/en/")) lang = "en";
  else{
    const saved = localStorage.getItem("footballQuizLanguage");
    lang = supported.includes(saved) ? saved : detectBrowserLanguage();
  }

  localStorage.setItem("footballQuizLanguage", lang);
  document.documentElement.lang = lang;
})();
</script>

<script>

    s.onload=resolve;
    s.onerror=reject;

}

  },

    label:"Domanda del Giorno",

  }
};

function currentLang(){
  const saved = localStorage.getItem("footballQuizLanguage");
  if(["en","es","pt","fr","it"].includes(saved)) return saved;
  return "en";
}

function dText(key){
  const lang = currentLang();
  return dailyText[lang][key] || dailyText.en[key];
}

function goHome(){
  location.href = "/" + currentLang() + "/";
}

function goPage(page){
  location.href = "/" + currentLang() + "/" + page;
}

function getField(field){
  const lang = currentLang();

  if(typeof field === "string") return field;
  if(Array.isArray(field)) return field;

  if(field && typeof field === "object"){
    return field[lang] || field.en || field.es || "";
  }

  return "";
}

function applyDailyTranslations(){
  document.documentElement.lang = currentLang();

  document.getElementById("siteName").innerText = t("site_name");
  document.getElementById("navHome").innerText = t("nav_home");
  document.getElementById("navDailyQuiz").innerText = t("nav_daily_quiz");
  document.getElementById("navAbout").innerText = t("nav_about");
  document.getElementById("navContact").innerText = t("nav_contact");

  document.getElementById("dailyTitle").innerText = dText("title");
  document.getElementById("dailySubtitle").innerText = dText("subtitle");
  document.getElementById("questionLabel").innerText = dText("label");
  document.getElementById("questionText").innerText = dText("loading");
}

function updateSEO(){
  const lang = currentLang();

  const seo = {
    en:{
      title:"Daily Football Quiz – New Football Trivia Question Every Day",
      description:"Play the Daily Football Quiz online. Answer one new football trivia question every day and test your football knowledge."
    },
    es:{

      description:"Juega el Quiz Diario de Fútbol online. Responde una nueva pregunta de fútbol cada día y pon a prueba tus conocimientos."
    },
    pt:{
      title:"Quiz Diário de Futebol – Nova Pergunta Todos os Dias",
      description:"Jogue o Quiz Diário de Futebol online. Responda uma nova pergunta de futebol todos os dias e teste seus conhecimentos."
    },
    fr:{
      title:"Quiz Football du Jour – Nouvelle Question Chaque Jour",
      description:"Jouez au Quiz Football du Jour en ligne. Répondez à une nouvelle question de football chaque jour et testez vos connaissances."
    },
    it:{
      title:"Quiz del Giorno sul Calcio – Nuova Domanda Ogni Giorno",
      description:"Gioca al Quiz del Giorno sul Calcio online. Rispondi a una nuova domanda di calcio ogni giorno e metti alla prova le tue conoscenze."
    }
  };

  document.title = seo[lang].title;
  document.querySelector("meta[name='description']").setAttribute("content", seo[lang].description);
}

function getDailyIndex(){
  if(typeof dailyQuizData === "undefined" || dailyQuizData.length === 0) return 0;

  const anchor = new Date(2026, 0, 1);
  const today = new Date();
  const todayMidnight = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  const diffDays = Math.floor((todayMidnight - anchor) / 86400000);

  return ((diffDays % dailyQuizData.length) + dailyQuizData.length) % dailyQuizData.length;
}

function getTodayKey(){
  const now = new Date();
  return `${now.getFullYear()}-${now.getMonth()+1}-${now.getDate()}`;
}

function getSavedAnswerKey(){
  return "footballQuizDailyAnswered_" + getTodayKey() + "_" + currentLang();
}

function renderDailyQuiz(){
  if(typeof dailyQuizData === "undefined" || dailyQuizData.length === 0){
    document.getElementById("questionText").innerText = "Daily quiz data not found.";
    document.getElementById("optionsContainer").innerHTML = "";
    return;
  }

  const index = getDailyIndex();
  const question = dailyQuizData[index];

  document.getElementById("questionText").innerText = getField(question.question);

  const optionList = getField(question.options);

  let html = "";

  optionList.forEach((option, i) => {
    html += `
      <button class="option-btn" id="option-${i}" onclick="selectOption(${i})">
        ${option}
      </button>
    `;
  });

  document.getElementById("optionsContainer").innerHTML = html;

  const answered = localStorage.getItem(getSavedAnswerKey());

  if(answered !== null){
    revealStoredResult(parseInt(answered, 10));
  }
}

function lockOptions(){
  document.querySelectorAll(".option-btn").forEach(btn => {
    btn.disabled = true;
  });
}

function showStatus(correct, alreadyPlayed){
  const statusBox = document.getElementById("statusBox");
  const statusTitle = document.getElementById("statusTitle");
  const statusText = document.getElementById("statusText");

  statusBox.style.display = "block";

  if(alreadyPlayed){
    statusTitle.innerText = dText("alreadyTitle");
    statusText.innerText = dText("alreadyText");
    return;
  }

  if(correct){
    statusTitle.innerText = dText("correctTitle");
    statusText.innerText = dText("correctText");
  }else{
    statusTitle.innerText = dText("wrongTitle");
    statusText.innerText = dText("wrongText");
  }
}

function revealStoredResult(selectedIndex){
  const question = dailyQuizData[getDailyIndex()];

  lockOptions();

  const correctBtn = document.getElementById(`option-${question.correct}`);
  if(correctBtn) correctBtn.classList.add("correct");

  if(selectedIndex !== question.correct){
    const wrongBtn = document.getElementById(`option-${selectedIndex}`);
    if(wrongBtn) wrongBtn.classList.add("wrong");
  }

  showStatus(selectedIndex === question.correct, true);
}

function selectOption(selectedIndex){
  const answerKey = getSavedAnswerKey();

  if(localStorage.getItem(answerKey) !== null) return;

  localStorage.setItem(answerKey, String(selectedIndex));

  const question = dailyQuizData[getDailyIndex()];

  lockOptions();

  const correctBtn = document.getElementById(`option-${question.correct}`);
  if(correctBtn) correctBtn.classList.add("correct");

  if(selectedIndex !== question.correct){
    const wrongBtn = document.getElementById(`option-${selectedIndex}`);
    if(wrongBtn) wrongBtn.classList.add("wrong");
  }

  showStatus(selectedIndex === question.correct, false);
}

function setupHeaderScroll(){
  const topUI = document.getElementById("topUI");

  function updateTopPadding(){
    document.body.style.paddingTop = (topUI.offsetHeight + 12) + "px";
  }

  function hideTopUI(){
    topUI.style.transform = `translateY(-${topUI.offsetHeight}px)`;
  }

  function showTopUI(){
    topUI.style.transform = "translateY(0)";
  }

  updateTopPadding();
  window.addEventListener("load", updateTopPadding);
  window.addEventListener("resize", updateTopPadding);

  let lastScroll = 0;

  window.addEventListener("scroll", () => {
    const currentScroll = window.scrollY || window.pageYOffset;

    if(currentScroll > lastScroll && currentScroll > 80){
      hideTopUI();
    }else if(currentScroll < 10){
      showTopUI();
    }

    lastScroll = currentScroll <= 0 ? 0 : currentScroll;
  }, { passive: true });
}

Promise.all([
  loadScript("translations.js"),
  loadScript("language.js"),
  loadScript("daily-quiz-data.js")
]).then(()=>{
  buildLanguageSelector("languageSelector");
  updateSEO();
  applyDailyTranslations();
  renderDailyQuiz();
  setupHeaderScroll();
});
</script>
