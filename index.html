<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Football Quiz</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- SEO básico -->
  <meta name="description" content="Play the best football quizzes online. Guess players, clubs and more!">
  
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #000;
      color: white;
      text-align: center;
    }

    header {
      padding: 20px;
    }

    .lang-buttons img {
      width: 40px;
      margin: 5px;
      cursor: pointer;
      border-radius: 8px;
    }

    h1 {
      font-size: 40px;
      margin: 10px 0;
    }

    .menu {
      margin: 20px 0;
    }

    .menu button {
      margin: 5px;
      padding: 10px 20px;
      border-radius: 20px;
      border: none;
      background: #222;
      color: white;
      cursor: pointer;
    }

    .quiz-card {
      margin: 40px auto;
      width: 90%;
      max-width: 600px;
      border-radius: 20px;
      padding: 20px;
      background: #111;
      box-shadow: 0 0 20px rgba(0,255,100,0.2);
    }

    .quiz-card img {
      width: 100%;
      border-radius: 15px;
    }

    .quiz-title {
      font-size: 22px;
      margin: 15px 0;
    }

    .play-btn {
      background: #00c853;
      border: none;
      padding: 15px 30px;
      border-radius: 30px;
      font-size: 18px;
      cursor: pointer;
    }

  </style>
</head>

<body>

<header>
  <div class="lang-buttons">
    <img src="https://flagcdn.com/w40/gb.png" onclick="changeLanguage('en')">
    <img src="https://flagcdn.com/w40/es.png" onclick="changeLanguage('es')">
    <img src="https://flagcdn.com/w40/pt.png" onclick="changeLanguage('pt')">
    <img src="https://flagcdn.com/w40/fr.png" onclick="changeLanguage('fr')">
    <img src="https://flagcdn.com/w40/it.png" onclick="changeLanguage('it')">
  </div>

  <h1>Football Quiz</h1>

  <div class="menu">
    <button onclick="goHome()">HOME</button>
    <button onclick="goToPage('daily-quiz.html')">DAILY QUIZ</button>
    <button onclick="goToPage('about.html')">ABOUT</button>
    <button onclick="goToPage('contact.html')">CONTACT</button>
  </div>
</header>

<h2>Featured Quizzes</h2>

<!-- QUIZ 1 -->
<div class="quiz-card">
  <img src="/images/thumbnails/quiz1.jpg">
  <div class="quiz-title">Guess the Player by Transfers</div>
  <button class="play-btn" onclick="goToQuiz('guess-player-by-transfers')">PLAY</button>
</div>

<!-- QUIZ 2 -->
<div class="quiz-card">
  <img src="/images/thumbnails/quiz2.jpg">
  <div class="quiz-title">Guess the Player by Club + Nationality + Number + Position</div>
  <button class="play-btn" onclick="goToQuiz('guess-player-by-club-nationality-number-position')">PLAY</button>
</div>

<!-- QUIZ 3 -->
<div class="quiz-card">
  <img src="/images/thumbnails/quiz3.jpg">
  <div class="quiz-title">Guess the Club by Player Nationalities</div>
  <button class="play-btn" onclick="goToQuiz('guess-club-by-player-nationalities')">PLAY</button>
</div>

<script>
function getLang() {
  const path = window.location.pathname.split("/");
  return path[1] || "en";
}

function changeLanguage(lang) {
  localStorage.setItem("lang", lang);
  window.location.href = "/" + lang + "/";
}

function goHome() {
  const lang = getLang();
  window.location.href = "/" + lang + "/";
}

function goToPage(page) {
  const lang = getLang();
  window.location.href = "/" + lang + "/" + page;
}

function goToQuiz(slug) {
  const lang = getLang();

  const routes = {
    en: {
      "guess-player-by-transfers": "guess-player-by-transfers",
      "guess-player-by-club-nationality-number-position": "guess-player-by-club-nationality-number-position",
      "guess-club-by-player-nationalities": "guess-club-by-player-nationalities"
    },
    es: {
      "guess-player-by-transfers": "adivina-jugador-por-transferencias",
      "guess-player-by-club-nationality-number-position": "adivina-jugador-por-club-nacionalidad-dorsal-posicion",
      "guess-club-by-player-nationalities": "adivina-club-por-nacionalidad-de-jugadores"
    },
    pt: {
      "guess-player-by-transfers": "adivinhe-jogador-por-transferencias",
      "guess-player-by-club-nationality-number-position": "adivinhe-jogador-por-clube-nacionalidade-numero-posicao",
      "guess-club-by-player-nationalities": "adivinhe-clube-por-nacionalidade-dos-jogadores"
    },
    fr: {
      "guess-player-by-transfers": "devinez-joueur-par-transferts",
      "guess-player-by-club-nationality-number-position": "devinez-joueur-par-club-nationalite-numero-poste",
      "guess-club-by-player-nationalities": "devinez-club-par-nationalite-des-joueurs"
    },
    it: {
      "guess-player-by-transfers": "indovina-giocatore-dai-trasferimenti",
      "guess-player-by-club-nationality-number-position": "indovina-giocatore-da-club-nazionalita-numero-ruolo",
      "guess-club-by-player-nationalities": "indovina-club-dalla-nazionalita-dei-giocatori"
    }
  };

  const finalPath = routes[lang][slug] || slug;
  window.location.href = "/" + lang + "/" + finalPath;
}
</script>

</body>
</html>
