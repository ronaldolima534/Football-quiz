<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Football Quiz</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0b0b0b;
color:white;
}

/* ===== TOP ===== */
.top-ui{
position:fixed;
top:0;
left:0;
width:100%;
background:#0b0b0b;
z-index:1000;
border-bottom:1px solid #222;
}

/* ===== LANG ===== */
.lang-top{
padding:10px;
display:flex;
justify-content:center;
}

.lang-buttons{
display:flex;
gap:10px;
}

/* BOTÓN */
.lang-btn{
width:52px;
height:52px;
border-radius:14px;
background:#1b1b1b;
border:1px solid #333;
cursor:pointer;

display:flex;
align-items:center;
justify-content:center;

padding:0;
transition:0.2s;
}

/* HOVER */
.lang-btn:hover{
transform:scale(1.05);
}

/* ACTIVO */
.lang-btn.active{
background:#22c55e;
border:none;
}

/* IMAGEN */
.lang-btn img{
width:30px;
height:20px;
object-fit:cover;
border-radius:4px;
display:block;
}

/* ===== HEADER ===== */
.header{
text-align:center;
padding:10px 0;
}

.brand{
font-size:32px;
font-weight:bold;
}

/* ===== NAV ===== */
.nav{
display:flex;
justify-content:center;
gap:10px;
padding-bottom:10px;
}

.nav button{
padding:10px 14px;
border-radius:12px;
border:1px solid #333;
background:#1b1b1b;
color:white;
cursor:pointer;
font-weight:bold;
}

.nav .active{
background:#22c55e;
color:black;
border:none;
}

/* ===== CONTENT ===== */
.container{
margin-top:140px;
padding:20px;
}

/* CARD */
.card{
background:#111;
border-radius:20px;
padding:15px;
margin-bottom:20px;
border:1px solid #222;
}

.card img{
width:100%;
border-radius:14px;
}

/* TITLE */
.card-title{
text-align:center;
font-weight:bold;
font-size:18px;
margin:10px 0;
}

/* BUTTON */
.play-btn{
width:100%;
padding:14px;
border-radius:14px;
background:#22c55e;
color:black;
font-weight:bold;
border:none;
cursor:pointer;
}
</style>
</head>

<body>

<div class="top-ui">

  <div class="lang-top">
    <div class="lang-buttons" id="languageSelector"></div>
  </div>

  <div class="header">
    <div class="brand">Football Quiz</div>
  </div>

  <div class="nav">
    <button class="active">HOME</button>
    <button onclick="location.href='daily-quiz.html'">DAILY QUIZ</button>
    <button>ABOUT</button>
    <button>CONTACT</button>
  </div>

</div>

<div class="container">

  <div class="card">
    <img src="images/thumbnails/quiz1.webp">
    <div class="card-title">Guess the player by transfers</div>
    <button class="play-btn">PLAY NOW</button>
  </div>

</div>

<script src="language.js"></script>

<script>
buildLanguageSelector("languageSelector");
</script>

</body>
</html>
