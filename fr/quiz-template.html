<script>
(function(){
  const supported = ["en","es","pt","fr","it"];
  const path = window.location.pathname;

  function detectBrowserLanguage(){
    const browserLang = (navigator.language || navigator.userLanguage || "en").toLowerCase();

    if(browserLang.startsWith("es")) return "es";
    if(browserLang.startsWith("pt")) return "pt";
    if(browserLang.startsWith("fr")) return "fr";
    if(browserLang.startsWith("it")) return "it";

    return "en";
  }

  let lang = null;

  if(path.startsWith("/es/")) lang = "es";
  else if(path.startsWith("/pt/")) lang = "pt";
  else if(path.startsWith("/fr/")) lang = "fr";
  else if(path.startsWith("/it/")) lang = "it";
  else if(path.startsWith("/en/")) lang = "en";
  else{
    const saved = localStorage.getItem("footballQuizLanguage");
    lang = supported.includes(saved) ? saved : detectBrowserLanguage();
  }

  localStorage.setItem("footballQuizLanguage", lang);
  document.documentElement.lang = lang;
})();
</script>

let mode, quiz, current=1, showing=false, selectedQuestions=[];
let hintUsedForCurrentQuestion = false;

function currentLang(){
  const saved = localStorage.getItem("footballQuizLanguage");
  if(["en","es","pt","fr","it"].includes(saved)) return saved;
  return "en";
}

function langPrefix(){
  return "/" + currentLang() + "/";
}

function goHome(){
  location.href = langPrefix();
}

function goPage(page){
  location.href = langPrefix() + page;
}

function ht(key){
  const lang = currentLang();
  return hintText[lang][key] || hintText.en[key];
}

function applySEO(){
  const lang=currentLang();
  const seo=(seoData[lang] && seoData[lang][mode]) ? seoData[lang][mode] : seoData.en[mode];

  document.title=seo.title;
  document.getElementById("seoDescription").setAttribute("content",seo.description);
}

function getQuizDescription(){
  const lang=currentLang();
  return (seoData[lang] && seoData[lang][mode] ? seoData[lang][mode] : seoData.en[mode]).text;
}

function applyHintTranslations(){
  document.getElementById("hintBtn").innerText = ht("btn");
  document.getElementById("hintAdText").innerText = ht("ad");
  document.getElementById("hintLoadingTitle").innerText = ht("loadingTitle");
  document.getElementById("hintLoadingText").innerText = ht("loading");
  document.getElementById("hintReadyTitle").innerText = ht("ready");
  document.getElementById("hintCloseBtn").innerText = ht("close");
}

function applyQuizTranslations(){
  document.documentElement.lang=currentLang();

  document.getElementById("siteName").innerText=t("site_name");
  document.getElementById("navHome").innerText=t("nav_home");
  document.getElementById("navDailyQuiz").innerText=t("nav_daily_quiz");
  document.getElementById("navAbout").innerText=t("nav_about");
  document.getElementById("navContact").innerText=t("nav_contact");
  document.getElementById("quizTitle").innerText=t(quiz.titleKey);
  document.getElementById("quizDescription").innerText=getQuizDescription();
  document.getElementById("backHomeBtn").innerText=t("back_home");
  document.getElementById("finalTitle").innerText=t("final_title");
  document.getElementById("finalOption1").innerText=t("final_option_1");
  document.getElementById("finalOption2").innerText=t("final_option_2");
  document.getElementById("finalOption3").innerText=t("final_option_3");
  document.getElementById("finalOption4").innerText=t("final_option_4");
  document.getElementById("playAgainBtn").innerText=t("play_again");
  document.getElementById("homeBtn").innerText=t("home");

  applyHintTranslations();
}

function shuffleArray(array){
  const arr=[...array];
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function pickRandomNumbers(total,count){
  const numbers=[];
  for(let i=1;i<=total;i++) numbers.push(i);
  return shuffleArray(numbers).slice(0,count);
}

function buildQuestionSet(){
  selectedQuestions=[
    ...pickRandomNumbers(quiz.totalEasy,5).map(num=>({level:"easy",number:num})),
    ...pickRandomNumbers(quiz.totalMedium,5).map(num=>({level:"medium",number:num})),
    ...pickRandomNumbers(quiz.totalHard,5).map(num=>({level:"hard",number:num}))
  ];
}

function getCurrentQuestion(){return selectedQuestions[current-1];}
function getLevel(){return getCurrentQuestion().level;}
function getNumber(){return getCurrentQuestion().number;}

function imgPath(prefix){
  return `${BASE}${quiz.folder}/${getLevel()}/${prefix}${getNumber()}.webp`;
}

function hintPath(){
  const prefix = quiz.hintPrefix || "h";
  return `${BASE}${quiz.folder}/${getLevel()}/${prefix}${getNumber()}.webp`;
}

function updateHintButton(){
  const btn = document.getElementById("hintBtn");

  if(!quiz.hasHint){
    btn.style.display = "none";
    return;
  }

  btn.style.display = "block";
  btn.disabled = hintUsedForCurrentQuestion;

  if(hintUsedForCurrentQuestion){
    btn.classList.add("used");
  }else{
    btn.classList.remove("used");
  }
}

function updateBadge(){
  const badge=document.getElementById("difficulty");
  const level=getLevel();
  badge.className="badge";

  if(level==="easy"){
    badge.innerText=t("easy");
    badge.classList.add("easy");
  }else if(level==="medium"){
    badge.innerText=t("medium");
    badge.classList.add("medium");
  }else{
    badge.innerText=t("hard");
    badge.classList.add("hard");
  }
}

function updateProgress(){
  document.getElementById("progressBar").style.width=(current/15*100)+"%";
}

function updateCounter(){
  document.getElementById("counter").innerText=`${t("question_label")} ${current} / 15`;
}

function animateMainButton(){
  const btn=document.getElementById("mainBtn");
  btn.classList.remove("btn-pop","btn-glow");
  void btn.offsetWidth;
  btn.classList.add("btn-pop","btn-glow");
}

function updateMainButton(){
  const btn=document.getElementById("mainBtn");
  btn.innerText=!showing?t("answer"):(current===15?t("finish"):t("next"));
  animateMainButton();
}

function preloadImage(src){
  const img=new Image();
  img.src=src;
}

function preloadCurrentPair(){
  preloadImage(imgPath(quiz.questionPrefix));
  preloadImage(imgPath(quiz.answerPrefix));
  if(quiz.hasHint) preloadImage(hintPath());
}

function preloadNextQuestion(){
  if(current>=15) return;

  const nextQuestion=selectedQuestions[current];
  if(!nextQuestion) return;

  preloadImage(`${BASE}${quiz.folder}/${nextQuestion.level}/${quiz.questionPrefix}${nextQuestion.number}.webp`);
  preloadImage(`${BASE}${quiz.folder}/${nextQuestion.level}/${quiz.answerPrefix}${nextQuestion.number}.webp`);

  if(quiz.hasHint){
    const prefix = quiz.hintPrefix || "h";
    preloadImage(`${BASE}${quiz.folder}/${nextQuestion.level}/${prefix}${nextQuestion.number}.webp`);
  }
}

function animateViewerFlash(){
  const viewer=document.getElementById("viewerBox");
  viewer.classList.remove("flash");
  void viewer.offsetWidth;
  viewer.classList.add("flash");
}

function swapImage(src,type){
  const img=document.getElementById("quizImage");
  const preload=new Image();

  preload.onload=function(){
    img.className=type==="answer"?"img-out-answer":"img-out-next";

    setTimeout(()=>{
      img.src=src;
      img.className=type==="answer"?"img-in-answer":"img-in-next";
      animateViewerFlash();
    },170);
  };

  preload.onerror=function(){
    img.className="";
  };

  preload.src=src;
}

function loadQuestion(){
  swapImage(imgPath(quiz.questionPrefix),"next");
}

function loadAnswer(){
  swapImage(imgPath(quiz.answerPrefix),"answer");
}

function mainAction(){
  if(!showing){
    loadAnswer();
    showing=true;
    updateMainButton();
    preloadNextQuestion();
  }else{
    if(current===15){
      endQuiz();
      return;
    }

    current++;
    showing=false;
    hintUsedForCurrentQuestion = false;

    updateBadge();
    updateProgress();
    updateCounter();
    updateMainButton();
    updateHintButton();
    closeHint();
    loadQuestion();
    preloadCurrentPair();
    preloadNextQuestion();
  }
}

function openHintDirect(){
  if(!quiz.hasHint || hintUsedForCurrentQuestion) return;

  document.getElementById("hintModal").style.display = "flex";
  document.getElementById("hintLoading").style.display = "block";
  document.getElementById("hintContent").style.display = "none";

  loadHintDirect();
}

function closeHint(){
  const modal = document.getElementById("hintModal");
  if(modal) modal.style.display = "none";
}

function loadHintDirect(){
  if(!quiz.hasHint || hintUsedForCurrentQuestion) return;

  setTimeout(() => {
    const img = document.getElementById("hintImage");
    const preload = new Image();

    preload.onload = function(){
      img.src = hintPath();

      document.getElementById("hintLoading").style.display = "none";
      document.getElementById("hintContent").style.display = "block";

      hintUsedForCurrentQuestion = true;
      updateHintButton();
    };

    preload.onerror = function(){
      document.getElementById("hintLoadingText").innerText = ht("missing");
    };

    preload.src = hintPath();
  }, 1400);
}

function endQuiz(){
  document.getElementById("difficulty").style.display="none";
  document.querySelector(".viewer").style.display="none";
  document.getElementById("counter").style.display="none";
  document.getElementById("gameButtons").style.display="none";
  document.getElementById("finalBox").style.display="block";
  closeHint();
}

function finishChoice(){
  document.getElementById("afterChoice").style.display="block";
}

function setupHeaderScroll(){
  const topUI=document.getElementById("topUI");

  function updateTopPadding(){
    document.body.style.paddingTop=(topUI.offsetHeight+12)+"px";
  }

  function hideTopUI(){
    topUI.style.transform=`translateY(-${topUI.offsetHeight}px)`;
  }

  function showTopUI(){
    topUI.style.transform="translateY(0)";
  }

  updateTopPadding();
  window.addEventListener("load",updateTopPadding);
  window.addEventListener("resize",updateTopPadding);

  let lastScroll=0;

  window.addEventListener("scroll",()=>{
    const currentScroll=window.scrollY||window.pageYOffset;

    if(currentScroll>lastScroll&&currentScroll>80){
      hideTopUI();
    }else if(currentScroll<10){
      showTopUI();
    }

    lastScroll=currentScroll<=0?0:currentScroll;
  },{passive:true});
}

Promise.all([
  loadScript("quiz-data.js"),
  loadScript("translations.js"),
  loadScript("language.js")
]).then(()=>{
  mode=getModeFromUrl();
  quiz=quizData[mode];

  if(!quiz){
    alert("Quiz not found");
    location.href=langPrefix();
    return;
  }

  buildLanguageSelector("languageSelector");
  buildQuestionSet();
  applySEO();
  applyQuizTranslations();
  updateBadge();
  updateProgress();
  updateCounter();
  updateMainButton();
  updateHintButton();
  preloadCurrentPair();
  preloadNextQuestion();
  loadQuestion();
  setupHeaderScroll();
});
</script>
