<script>
(function(){
  const path = window.location.pathname;

  if(path.startsWith("/es/")){
    localStorage.setItem("footballQuizLanguage","es");
    document.documentElement.lang = "es";
  }else if(path.startsWith("/pt/")){
    localStorage.setItem("footballQuizLanguage","pt");
    document.documentElement.lang = "pt";
  }else if(path.startsWith("/fr/")){
    localStorage.setItem("footballQuizLanguage","fr");
    document.documentElement.lang = "fr";
  }else if(path.startsWith("/it/")){
    localStorage.setItem("footballQuizLanguage","it");
    document.documentElement.lang = "it";
  }else{
    localStorage.setItem("footballQuizLanguage","en");
    document.documentElement.lang = "en";
  }
})();
</script>

<script>
const contactText = {
  en:{
    title:"Contact Football Quiz",
    subtitle:"Have an idea, suggestion or question? Send a message and help improve Football Quiz.",
    sectionTitle:"Get in touch",
    text1:"You can contact Football Quiz for suggestions, quiz ideas, feedback, corrections or collaboration opportunities.",
    text2:"If you notice an error in a quiz or want to suggest a new football challenge, feel free to send a message.",
    emailLabel:"Email",
    cta:"BACK TO QUIZZES"
  },
  es:{
    title:"Contacto Football Quiz",
    subtitle:"¿Tienes una idea, sugerencia o pregunta? Envía un mensaje y ayuda a mejorar Football Quiz.",
    sectionTitle:"Ponte en contacto",
    text1:"Puedes contactar con Football Quiz para sugerencias, ideas de quizzes, comentarios, correcciones u oportunidades de colaboración.",
    text2:"Si encuentras un error en un quiz o quieres sugerir un nuevo reto de fútbol, puedes enviar un mensaje.",
    emailLabel:"Correo",
    cta:"VOLVER A LOS QUIZZES"
  },
  pt:{
    title:"Contato Football Quiz",
    subtitle:"Tem uma ideia, sugestão ou pergunta? Envie uma mensagem e ajude a melhorar o Football Quiz.",
    sectionTitle:"Entre em contato",
    text1:"Você pode entrar em contato com o Football Quiz para sugestões, ideias de quizzes, feedback, correções ou oportunidades de colaboração.",
    text2:"Se encontrar um erro em um quiz ou quiser sugerir um novo desafio de futebol, fique à vontade para enviar uma mensagem.",
    emailLabel:"Email",
    cta:"VOLTAR AOS QUIZZES"
  },
  fr:{
    title:"Contact Football Quiz",
    subtitle:"Vous avez une idée, une suggestion ou une question ? Envoyez un message et aidez à améliorer Football Quiz.",
    sectionTitle:"Contactez-nous",
    text1:"Vous pouvez contacter Football Quiz pour des suggestions, des idées de quiz, des retours, des corrections ou des opportunités de collaboration.",
    text2:"Si vous remarquez une erreur dans un quiz ou souhaitez suggérer un nouveau défi football, vous pouvez envoyer un message.",
    emailLabel:"Email",
    cta:"RETOUR AUX QUIZ"
  },
  it:{
    title:"Contatto Football Quiz",
    subtitle:"Hai un’idea, un suggerimento o una domanda? Invia un messaggio e aiuta a migliorare Football Quiz.",
    sectionTitle:"Mettiti in contatto",
    text1:"Puoi contattare Football Quiz per suggerimenti, idee per quiz, feedback, correzioni o opportunità di collaborazione.",
    text2:"Se noti un errore in un quiz o vuoi suggerire una nuova sfida sul calcio, puoi inviare un messaggio.",
    emailLabel:"Email",
    cta:"TORNA AI QUIZ"
  }
};

function currentLang(){
  const lang = getSavedLanguage();
  if(["en","es","pt","fr","it"].includes(lang)) return lang;
  return "en";
}

function ct(key){
  const lang = currentLang();
  return contactText[lang][key] || contactText.en[key];
}

function safeT(key, fallback){
  try{
    const value = t(key);
    return value && value !== key ? value : fallback;
  }catch{
    return fallback;
  }
}

function applyContactTranslations(){
  document.documentElement.lang = currentLang();

  document.getElementById("siteName").innerText = safeT("site_name","Football Quiz");
  document.getElementById("navHome").innerText = safeT("nav_home","HOME");
  document.getElementById("navDailyQuiz").innerText = safeT("nav_daily_quiz","DAILY QUIZ");
  document.getElementById("navAbout").innerText = safeT("nav_about","ABOUT");
  document.getElementById("navContact").innerText = safeT("nav_contact","CONTACT");

  document.getElementById("contactTitle").innerText = ct("title");
  document.getElementById("contactSubtitle").innerText = ct("subtitle");
  document.getElementById("contactSectionTitle").innerText = ct("sectionTitle");
  document.getElementById("contactText1").innerText = ct("text1");
  document.getElementById("contactText2").innerText = ct("text2");
  document.getElementById("emailLabel").innerText = ct("emailLabel");
  document.getElementById("contactCta").innerText = ct("cta");
}

buildLanguageSelector("languageSelector");
applyContactTranslations();

const topUI = document.getElementById("topUI");

function updateTopPadding(){
  document.body.style.paddingTop = (topUI.offsetHeight + 12) + "px";
}

function hideTopUI(){
  topUI.style.transform = `translateY(-${topUI.offsetHeight}px)`;
}

function showTopUI(){
  topUI.style.transform = "translateY(0)";
}

updateTopPadding();
window.addEventListener("load", updateTopPadding);
window.addEventListener("resize", updateTopPadding);

let lastScroll = 0;

window.addEventListener("scroll", () => {
  const current = window.scrollY || window.pageYOffset;

  if(current > lastScroll && current > 80){
    hideTopUI();
  }else if(current < 10){
    showTopUI();
  }

  lastScroll = current <= 0 ? 0 : current;
}, { passive:true });
</script>
