<script>
(function(){
  const supported = ["en","es","pt","fr","it"];
  const path = window.location.pathname;

  function detectBrowserLanguage(){
    const browserLang = (navigator.language || navigator.userLanguage || "en").toLowerCase();
    if(browserLang.startsWith("es")) return "es";
    if(browserLang.startsWith("pt")) return "pt";
    if(browserLang.startsWith("fr")) return "fr";
    if(browserLang.startsWith("it")) return "it";
    return "en";
  }

  let lang = null;

  if(path.startsWith("/es/")) lang = "es";
  else if(path.startsWith("/pt/")) lang = "pt";
  else if(path.startsWith("/fr/")) lang = "fr";
  else if(path.startsWith("/it/")) lang = "it";
  else if(path.startsWith("/en/")) lang = "en";
  else{
    const saved = localStorage.getItem("footballQuizLanguage");
    lang = supported.includes(saved) ? saved : detectBrowserLanguage();
  }

  localStorage.setItem("footballQuizLanguage", lang);
  document.documentElement.lang = lang;
})();
</script>

  return text
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9\s]/g,"")
    .replace(/\s+/g," ")
    .trim();
}

function shuffleArray(array){
  const arr=[...array];
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function buildQuestionSet(){
  const easy = shuffleArray(quiz.easy).slice(0,5).map(q=>({...q,level:"easy"}));
  const medium = shuffleArray(quiz.medium).slice(0,5).map(q=>({...q,level:"medium"}));
  const hard = shuffleArray(quiz.hard).slice(0,5).map(q=>({...q,level:"hard"}));

  selectedQuestions = [...easy,...medium,...hard];
}

function getCurrentQuestion(){
  return selectedQuestions[current - 1];
}

function applyTranslations(){
  document.documentElement.lang = currentLang();

  document.getElementById("siteName").innerText = t("site_name");
  document.getElementById("navHome").innerText = t("nav_home");
  document.getElementById("navDailyQuiz").innerText = t("nav_daily_quiz");
  document.getElementById("navAbout").innerText = t("nav_about");
  document.getElementById("navContact").innerText = t("nav_contact");

  document.getElementById("quizTitle").innerText = tt("title");
  document.getElementById("quizDescription").innerText = tt("description");
  document.getElementById("answerInput").placeholder = tt("placeholder");
  document.getElementById("checkBtn").innerText = tt("check");
  document.getElementById("nextBtn").innerText = tt("next");
  document.getElementById("showAnswerBtn").innerText = tt("show");
  document.getElementById("backHomeBtn").innerText = tt("back");
  document.getElementById("finalTitle").innerText = tt("final");
  document.getElementById("playAgainBtn").innerText = tt("playAgain");
  document.getElementById("homeBtn").innerText = tt("home");
}

function updateBadge(){
  const badge = document.getElementById("difficulty");
  const level = getCurrentQuestion().level;

  badge.className = "badge";

  if(level === "easy"){
    badge.innerText = t("easy");
    badge.classList.add("easy");
  }else if(level === "medium"){
    badge.innerText = t("medium");
    badge.classList.add("medium");
  }else{
    badge.innerText = t("hard");
    badge.classList.add("hard");
  }
}

function updateProgress(){
  document.getElementById("progressBar").style.width = (current / 15 * 100) + "%";
}

function updateCounter(){
  document.getElementById("counter").innerText = `${t("question_label")} ${current} / 15`;
}

function imagePath(){
  const q = getCurrentQuestion();
  return `${BASE}${quiz.folder}/${q.level}/q${q.number}.webp`;
}

function animateViewerFlash(){
  const viewer=document.getElementById("viewerBox");
  viewer.classList.remove("flash");
  void viewer.offsetWidth;
  viewer.classList.add("flash");
}

function loadImage(){
  const img = document.getElementById("quizImage");
  const src = imagePath();
  const preload = new Image();

  preload.onload = function(){
    img.className = "img-out-next";
    setTimeout(()=>{
      img.src = src;
      img.className = "img-in-next";
      animateViewerFlash();
    },170);
  };

  preload.src = src;
}

function loadQuestion(){
  clearTimeout(autoNextTimer);
  answered = false;

  document.getElementById("answerInput").value = "";
  document.getElementById("answerInput").disabled = false;
  document.getElementById("answerInput").focus();

  document.getElementById("resultBox").className = "result-box";
  document.getElementById("resultBox").innerText = "";

  document.getElementById("answerPanel").style.display = "block";

  updateBadge();
  updateProgress();
  updateCounter();
  loadImage();
}

function showResult(type, message){
  const box = document.getElementById("resultBox");
  box.className = "result-box " + type;
  box.innerText = message;
}

function checkAnswer(){
  if(answered) return;

  const input = document.getElementById("answerInput").value;
  const q = getCurrentQuestion();

  if(!input.trim()){
    showResult("result-warning", tt("empty"));
    return;
  }

  const user = normalize(input);
  const correct = q.answers.some(answer => normalize(answer) === user);

  if(correct){
    score++;
    answered = true;
    document.getElementById("answerInput").disabled = true;
    showResult("result-correct", tt("correct"));

    autoNextTimer = setTimeout(()=>{
      nextQuestion();
    }, 950);

  }else{
    showResult("result-wrong", tt("wrong"));
  }
}

function showCorrectAnswer(){
  if(answered) return;

  const q = getCurrentQuestion();
  answered = true;
  document.getElementById("answerInput").disabled = true;
  showResult("result-warning", `${tt("answer")} ${q.answers[0]}`);
}

function nextQuestion(){
  clearTimeout(autoNextTimer);

  if(current >= 15){
    endQuiz();
    return;
  }

  current++;
  loadQuestion();
}

function endQuiz(){
  document.getElementById("difficulty").style.display = "none";
  document.getElementById("viewerBox").style.display = "none";
  document.getElementById("counter").style.display = "none";
  document.getElementById("answerPanel").style.display = "none";
  document.getElementById("finalBox").style.display = "block";
  document.getElementById("finalScore").innerText = `${tt("score")} ${score} / 15`;
  document.getElementById("progressBar").style.width = "100%";
}

function setupHeaderScroll(){
  const topUI=document.getElementById("topUI");

  function updateTopPadding(){
    document.body.style.paddingTop=(topUI.offsetHeight+12)+"px";
  }

  function hideTopUI(){
    topUI.style.transform=`translateY(-${topUI.offsetHeight}px)`;
  }

  function showTopUI(){
    topUI.style.transform="translateY(0)";
  }

  updateTopPadding();
  window.addEventListener("load",updateTopPadding);
  window.addEventListener("resize",updateTopPadding);

  let lastScroll=0;

  window.addEventListener("scroll",()=>{
    const currentScroll=window.scrollY||window.pageYOffset;

    if(currentScroll>lastScroll&&currentScroll>80){
      hideTopUI();
    }else if(currentScroll<10){
      showTopUI();
    }

    lastScroll=currentScroll<=0?0:currentScroll;
  },{passive:true});
}

document.addEventListener("keydown", function(e){
  if(e.key === "Enter"){
    if(!answered){
      checkAnswer();
    }else{
      nextQuestion();
    }
  }
});

Promise.all([
  loadScript("translations.js"),
  loadScript("language.js"),
  loadScript("typing-quiz-data.js")
]).then(()=>{
  quiz = typingQuizData[quizKey];

  buildLanguageSelector("languageSelector");
  applyTranslations();
  applySEO();
  buildQuestionSet();
  loadQuestion();
  setupHeaderScroll();
});
</script>

</body>
</html>
