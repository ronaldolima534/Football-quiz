<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Guess the Player Name | Football Quiz</title>

<style>
/* === MISMO ESTILO PREMIUM === */
body{
font-family:Arial;
background:linear-gradient(180deg,#080808,#111);
color:white;
text-align:center;
padding-top:160px;
}

.top-ui{
position:fixed;
top:0;
width:100%;
background:#111;
z-index:999;
padding:10px;
}

.brand{
font-size:28px;
font-weight:900;
}

.container{
max-width:700px;
margin:auto;
padding:20px;
}

.viewer{
background:#151515;
padding:10px;
border-radius:20px;
margin-bottom:20px;
}

.viewer img{
width:100%;
max-height:350px;
object-fit:contain;
}

.badge{
padding:10px 20px;
border-radius:20px;
font-weight:900;
margin-bottom:10px;
display:inline-block;
}

.easy{background:green;}
.medium{background:orange;}
.hard{background:red;}

.progress{
height:10px;
background:green;
margin-bottom:15px;
}

input{
width:100%;
padding:18px;
font-size:20px;
border-radius:12px;
margin-bottom:10px;
text-align:center;
}

.btn{
padding:16px;
font-size:18px;
font-weight:bold;
border-radius:12px;
border:none;
margin-top:10px;
cursor:pointer;
}

.green{
background:#22c55e;
color:black;
}

.gray{
background:#333;
color:white;
}

.result{
margin-top:10px;
font-size:20px;
font-weight:bold;
}
</style>
</head>

<body>

<div class="top-ui">
<div class="brand">Football Quiz</div>
</div>

<div class="container">

<div id="difficulty" class="badge easy">EASY</div>

<div class="progress" id="progressBar"></div>

<div class="viewer">
<img id="image">
</div>

<input id="input" placeholder="Type player name...">

<button class="btn green" onclick="checkAnswer()">CHECK</button>
<button class="btn gray" onclick="nextQuestion()">NEXT</button>

<div class="result" id="result"></div>

</div>

<script src="typing-quiz-data.js"></script>

<script>

let level = "easy";
let current = 0;
let score = 0;

function normalize(text){
return text.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();
}

function loadQuestion(){
const q = typingQuizData["guess-player-name"][level][current];
document.getElementById("image").src = "images/guess-player-name/"+level+"/q"+q.number+".webp";
document.getElementById("input").value="";
document.getElementById("result").innerText="";
updateProgress();
updateLevel();
}

function updateLevel(){
let badge = document.getElementById("difficulty");
badge.className="badge "+level;
badge.innerText=level.toUpperCase();
}

function updateProgress(){
document.getElementById("progressBar").style.width=((current+1)/15*100)+"%";
}

function checkAnswer(){
const input = document.getElementById("input").value;
const q = typingQuizData["guess-player-name"][level][current];

if(q.answers.some(a=>normalize(a)==normalize(input))){
document.getElementById("result").innerText="✅ Correct";
score++;

setTimeout(()=>{
nextQuestion();
},800);

}else{
document.getElementById("result").innerText="❌ Try again";
}
}

function nextQuestion(){
current++;

if(current>=5 && level=="easy"){level="medium";current=0;}
else if(current>=5 && level=="medium"){level="hard";current=0;}
else if(current>=5 && level=="hard"){alert("Finished");return;}

loadQuestion();
}

loadQuestion();

</script>

</body>
</html>
