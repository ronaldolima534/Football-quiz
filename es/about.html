<script>
(function(){
  const path = window.location.pathname;

  if(path.startsWith("/es/")){
    localStorage.setItem("footballQuizLanguage","es");
    document.documentElement.lang = "es";
  }else if(path.startsWith("/pt/")){
    localStorage.setItem("footballQuizLanguage","pt");
    document.documentElement.lang = "pt";
  }else if(path.startsWith("/fr/")){
    localStorage.setItem("footballQuizLanguage","fr");
    document.documentElement.lang = "fr";
  }else if(path.startsWith("/it/")){
    localStorage.setItem("footballQuizLanguage","it");
    document.documentElement.lang = "it";
  }else{
    localStorage.setItem("footballQuizLanguage","en");
    document.documentElement.lang = "en";
  }
})();
</script>

<script>

    sectionTitle:"O que é o Football Quiz?",
    text1:"Football Quiz é uma plataforma online de trivia de futebol onde os usuários podem testar seus conhecimentos com quizzes visuais e desafios diários.",
    text2:"Nosso objetivo é criar quizzes de futebol divertidos, rápidos e fáceis de jogar para fãs do mundo todo.",
    whatTitle:"O que você pode jogar aqui?",
    point1:"Adivinhe jogadores por transferências e trajetórias.",
    point2:"Adivinhe jogadores usando pistas como nacionalidade, clube, número da camisa e posição.",
    point3:"Jogue desafios diários de trivia futebolística.",
    point4:"Aproveite quizzes de futebol em vários idiomas.",
    cta:"JOGAR QUIZZES"
  },
  fr:{
    title:"À propos de Football Quiz",
    subtitle:"Un site de quiz football conçu pour les fans qui aiment les joueurs, les clubs, les transferts et les équipes nationales.",
    sectionTitle:"Qu’est-ce que Football Quiz ?",

    text2:"Notre objectif est de créer des quiz football amusants, rapides et faciles à jouer pour les fans du monde entier.",
    whatTitle:"Que pouvez-vous jouer ici ?",
    point1:"Devinez les joueurs grâce à leurs transferts et parcours.",
    point2:"Devinez les joueurs avec des indices comme la nationalité, le club, le numéro et le poste.",
    point3:"Jouez à des défis quotidiens de culture footballistique.",

    cta:"GIOCA AI QUIZ"

function currentLang(){
  const lang = getSavedLanguage();
  if(["en","es","pt","fr","it"].includes(lang)) return lang;
  return "en";
}

function at(key){
  const lang = currentLang();
  return aboutText[lang][key] || aboutText.en[key];
}

function safeT(key, fallback){
  try{
    const value = t(key);
    return value && value !== key ? value : fallback;
  }catch{
    return fallback;
  }
}

function applyAboutTranslations(){
  document.documentElement.lang = currentLang();

  document.getElementById("siteName").innerText = safeT("site_name","Football Quiz");
  document.getElementById("navHome").innerText = safeT("nav_home","HOME");
  document.getElementById("navDailyQuiz").innerText = safeT("nav_daily_quiz","DAILY QUIZ");
  document.getElementById("navAbout").innerText = safeT("nav_about","ABOUT");
  document.getElementById("navContact").innerText = safeT("nav_contact","CONTACT");

  document.getElementById("aboutTitle").innerText = at("title");
  document.getElementById("aboutSubtitle").innerText = at("subtitle");
  document.getElementById("aboutSectionTitle").innerText = at("sectionTitle");
  document.getElementById("aboutText1").innerText = at("text1");
  document.getElementById("aboutText2").innerText = at("text2");
  document.getElementById("aboutWhatTitle").innerText = at("whatTitle");
  document.getElementById("aboutPoint1").innerText = at("point1");
  document.getElementById("aboutPoint2").innerText = at("point2");
  document.getElementById("aboutPoint3").innerText = at("point3");
  document.getElementById("aboutPoint4").innerText = at("point4");
  document.getElementById("aboutCta").innerText = at("cta");
}

buildLanguageSelector("languageSelector");
applyAboutTranslations();

const topUI = document.getElementById("topUI");

function updateTopPadding(){
  document.body.style.paddingTop = (topUI.offsetHeight + 12) + "px";
}

function hideTopUI(){
  topUI.style.transform = `translateY(-${topUI.offsetHeight}px)`;
}

function showTopUI(){
  topUI.style.transform = "translateY(0)";
}

updateTopPadding();
window.addEventListener("load", updateTopPadding);
window.addEventListener("resize", updateTopPadding);

let lastScroll = 0;

window.addEventListener("scroll", () => {
  const current = window.scrollY || window.pageYOffset;

  if(current > lastScroll && current > 80){
    hideTopUI();
  }else if(current < 10){
    showTopUI();
  }

  lastScroll = current <= 0 ? 0 : current;
}, { passive:true });
</script>
