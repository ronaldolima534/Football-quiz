<!DOCTYPE html>
<html lang="es">
<head>

<!-- 🔥 FUERZA IDIOMA ESPAÑOL -->
<script>
localStorage.setItem("footballQuizLanguage","es");

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Football Quiz – Adivina Jugadores, Clubes y Transferencias</title>

<meta name="description" content="Juega Football Quiz online. Adivina jugadores por transferencias, clubes, nacionalidad y más.">
<meta name="robots" content="index, follow">

<link rel="canonical" href="https://football-quiz-nu.vercel.app/es/">

<style>
/* ⚡ MISMO CSS QUE TU INDEX (NO CAMBIA) */
*{margin:0;padding:0;box-sizing:border-box;}
:root{
--card:#151515;--card2:#1b1b1b;--line:#2a2a2a;
--green:#22c55e;--green2:#15803d;--greenDark:#0f5f2d;
--white:#ffffff;--soft:#b8b8b8;
}
body{
font-family:Arial,sans-serif;
background:radial-gradient(circle at top, rgba(34,197,94,.12), transparent 28%),linear-gradient(180deg,#070707,#111);
color:var(--white);
text-align:center;
padding-top:158px;
}
.top-ui{position:fixed;top:0;left:0;width:100%;z-index:9999;background:rgba(8,8,8,.95);backdrop-filter:blur(10px);}
.lang-top{padding:12px;}
.lang-buttons{display:flex;gap:8px;justify-content:center;}
.lang-btn{width:44px;height:44px;border-radius:12px;border:1px solid #333;background:#1d1d1d;display:flex;align-items:center;justify-content:center;}
.lang-btn img{width:30px;height:22px;}
.header{padding:20px;}
.brand{font-size:36px;font-weight:900;}
.nav{display:flex;justify-content:center;gap:10px;}
.nav button{padding:10px 14px;border-radius:12px;background:#1d1d1d;color:white;border:1px solid #333;}
.container{width:94%;max-width:820px;margin:20px auto;display:grid;gap:20px;}
.card{background:#141414;border-radius:20px;padding:15px;}
.thumb img{width:100%;border-radius:14px;}
.quiz-title{font-size:20px;margin:10px 0;}
.play{width:100%;padding:14px;border-radius:14px;background:#22c55e;border:none;font-weight:bold;}
</style>

</head>

<body>

<div class="top-ui">

  <div class="lang-top">
    <div class="lang-buttons" id="languageSelector"></div>
  </div>

  <div class="header">
    <div class="brand" id="siteName"></div>

    <div class="nav">
      <button onclick="location.href='index.html'" id="navHome"></button>
      <button onclick="location.href='daily-quiz.html'" id="navDailyQuiz"></button>
      <button onclick="location.href='about.html'" id="navAbout"></button>
      <button onclick="location.href='contact.html'" id="navContact"></button>
    </div>
  </div>

</div>

<div class="container" id="quizContainer"></div>

<script src="../quiz-data.js"></script>
<script src="../translations.js"></script>
<script src="../language.js"></script>

<script>
function safeT(key, fallback){
  try{
    const value = t(key);
    return value && value !== key ? value : fallback;
  }catch{
    return fallback;
  }
}

function buildHomeQuizzes(){
  const container = document.getElementById("quizContainer");

  const quizzes = Object.entries(quizData)
    .filter(([mode, quiz]) => quiz.showOnHome);

  let html = "";

  quizzes.forEach(([mode, quiz]) => {
    html += `
      <div class="card">
        <div class="thumb">
          <img src="../${quiz.thumbnail}">
        </div>

        <div class="quiz-title">
          ${safeT(quiz.titleKey, quiz.titleKey)}
        </div>

        <button class="play" onclick="location.href='quiz-template.html?mode=${mode}'">
          ${safeT("play", "JUGAR")}
        </button>
      </div>
    `;
  });

  container.innerHTML = html;
}

buildLanguageSelector("languageSelector");

document.getElementById("siteName").innerText = safeT("site_name","Football Quiz");
document.getElementById("navHome").innerText = safeT("nav_home","INICIO");
document.getElementById("navDailyQuiz").innerText = safeT("nav_daily_quiz","QUIZ DIARIO");
document.getElementById("navAbout").innerText = safeT("nav_about","ACERCA");
document.getElementById("navContact").innerText = safeT("nav_contact","CONTACTO");

buildHomeQuizzes();
</script>

</body>
</html>
